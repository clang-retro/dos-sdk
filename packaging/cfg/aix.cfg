# IBM AIX 4.1 and later on 32-bit PowerPC, for the PowerPC 601, which
# every machine running AIX 4 or 5 has or betters (-mcpu=603 and -mcpu=604
# work too; leave pwr3 to pwr5 alone, for which clang turns on AltiVec).
# Static programs with picolibc, linked by xcoff-ld; clang's AIX driver
# finds the sysroot, ../powerpc-ibm-aix, by itself.
--target=powerpc-ibm-aix4.3
