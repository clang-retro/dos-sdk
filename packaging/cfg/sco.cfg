# SCO UnixWare 2 and later and OpenServer 5 and later on 32-bit x86, for
# the i386 with x87 floating point (-march=i486 and so on for later CPUs;
# leave SSE alone before UnixWare 7.1.3 and OpenServer 5.0.7). Static
# programs with picolibc; clang's SCO driver finds the sysroot,
# ../i386-pc-sco, by itself.
--target=i386-pc-sco
