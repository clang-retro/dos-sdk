# NetBSD 1.5 and later on 32-bit x86, for the i486 with x87 floating point
# (add -march=pentium4 for SSE2); sysroot: ../i386-unknown-netbsd.
# clang's NetBSD driver links with the system ld unless told otherwise.
--target=i386-unknown-netbsd
-march=i486
-fuse-ld=lld
--sysroot=<CFGDIR>/../i386-unknown-netbsd
-static
